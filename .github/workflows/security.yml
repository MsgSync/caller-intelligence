name: Security Scanning

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx @microsoft/api-extractor run --local
      - run: npx eslint . --ext .ts

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx snyk test
      - run: npx audit-ci --config audit-ci.json

  penetration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx zap-cli quick-scan --self-contained --start-options '-config api.disablekey=true' http://localhost:4000
      - run: npx nmap -sV localhost
      - run: npx nikto -h http://localhost:4000
